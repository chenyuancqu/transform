<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WebGL Performance Test - Triangle Count</title>
  <style>
    body { margin: 0; background: #1a1a2e; color: #eee; font-family: monospace; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 999; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 4px; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .progress-bar { width: 600px; height: 20px; background: #333; margin: 10px 0; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); transition: width 0.1s; }
    .stats { margin-top: 10px; }
    .stat-item { display: flex; justify-content: space-between; min-width: 300px; margin: 3px 0; }
    .stat-value { color: #4ecdc4; font-weight: bold; }
  </style>
</head>
<body>
  <div id="info">
    <h3 style="margin:0 0 5px 0;">WebGL Performance Test</h3>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="stats">
      <div class="stat-item"><span>Frames:</span><span class="stat-value" id="frames">-</span></div>
      <div class="stat-item"><span>AVG FPS:</span><span class="stat-value" id="fps">-</span></div>
      <div class="stat-item"><span>P95 MS:</span><span class="stat-value" id="p95ms">-</span></div>
      <div class="stat-item"><span>Triangles:</span><span class="stat-value" id="triangles">-</span></div>
      <div class="stat-item"><span>Faces (Quads):</span><span class="stat-value" id="faces">-</span></div>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from '@react-three/drei';

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(200, 150, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxDistance = 500;
    controls.target.set(0, 0, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(100, 200, 100);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.camera.near = 0.5;
    directionalLight.shadow.camera.far = 500;
    directionalLight.shadow.camera.left = -200;
    directionalLight.shadow.camera.right = 200;
    directionalLight.shadow.camera.top = 200;
    directionalLight.shadow.camera.bottom = -200;
    scene.add(directionalLight);

    // Stats tracking
    let frameCount = 0;
    let lastTime = performance.now();
    let fpsHistory = [];
    let triangleCount = 0;
    let faceCount = 0;

    // Progress tracking
    const progressFill = document.getElementById('progress');
    const framesEl = document.getElementById('frames');
    const fpsEl = document.getElementById('fps');
    const p95msEl = document.getElementById('p95ms');
    const trianglesEl = document.getElementById('triangles');
    const facesEl = document.getElementById('faces');

    // Create test geometry with increasing complexity
    function createSceneWithFaces(numFaces) {
      // Clear previous scene
      while(scene.children.length > 0) {
        const obj = scene.children[0];
        if(obj.geometry) obj.geometry.dispose();
        if(obj.material) {
          if(Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
        scene.remove(obj);
      }
      
      scene.add(ambientLight);
      scene.add(directionalLight);

      const materials = [
        new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.3 }),
        new THREE.MeshStandardMaterial({ color: 0x4ecdc4, roughness: 0.3 }),
        new THREE.MeshStandardMaterial({ color: 0x45b7d1, roughness: 0.3 }),
        new THREE.MeshStandardMaterial({ color: 0x96ceb4, roughness: 0.3 }),
        new THREE.MeshStandardMaterial({ color: 0xffeead, roughness: 0.3 })
      ];

      const maxMeshes = Math.floor(numFaces / 10);
      const geometries = [];
      
      for(let i = 0; i < maxMeshes; i++) {
        const material = materials[i % materials.length];
        
        // Varying box sizes
        const size = 2 + Math.random() * 3;
        const geometry = new THREE.BoxGeometry(size, size, size);
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(
          (Math.random() - 0.5) * 150,
          (Math.random() - 0.5) * 100,
          (Math.random() - 0.5) * 150
        );
        mesh.rotation.y = Math.random() * Math.PI;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        
        scene.add(mesh);
        geometries.push(geometry);
      }

      triangleCount = numFaces * 2; // Each quad has 2 triangles
      faceCount = numFaces;
      
      console.log(`Created scene with ${numFaces} faces (${triangleCount} triangles)`);
      return geometries;
    }

    // Load geometry and track performance
    async function testPerformance(startFaces, step, targetMaxFaces) {
      const geometries = createSceneWithFaces(startFaces);
      
      // Warmup render
      await renderer.renderAsync(scene, camera);
      
      // Performance measurement loop
      const measurements = [];
      const sampleCount = 100;
      
      for(let i = 0; i < sampleCount; i++) {
        const startTime = performance.now();
        await renderer.renderAsync(scene, camera);
        const deltaTime = performance.now() - startTime;
        measurements.push(deltaTime);
        
        // Update UI every 5 samples
        if(i % 5 === 0) {
          progressFill.style.width = `${(startFaces / targetMaxFaces) * 100}%`;
          const avgFps = (sampleCount / ((measurements.reduce((a,b) => a+b, 0) / 1000))) / 100;
          framesEl.textContent = i;
          fpsEl.textContent = avgFps.toFixed(1);
          p95msEl.textContent = measurements.slice(-1).pop().toFixed(2) + 'ms';
          trianglesEl.textContent = (startFaces * 2).toLocaleString();
          facesEl.textContent = startFaces.toLocaleString();
        }
        
        await new Promise(resolve => setTimeout(resolve, 10));
      }
      
      const sorted = measurements.sort((a, b) => a - b);
      const p95Index = Math.floor(sorted.length * 0.95);
      const p95Ms = sorted[p95Index].toFixed(2);
      const avgMs = (measurements.reduce((a, b) => a + b, 0) / measurements.length).toFixed(2);
      const avgFps = (1000 / avgMs).toFixed(1);
      
      framesEl.textContent = `${sorted.length} samples`;
      fpsEl.textContent = avgFps;
      p95msEl.textContent = `${p95Ms} ms`;
      trianglesEl.textContent = (startFaces * 2).toLocaleString();
      facesEl.textContent = startFaces.toLocaleString();
      
      console.log(`Face count: ${startFaces}, Avg: ${avgMs}ms, P95: ${p95Ms}ms, FPS: ${avgFps}`);
      
      return { faces: startFaces, p95Ms: parseFloat(p95Ms), avgMs: parseFloat(avgMs) };
    }

    // Run tests at different scales
    async function runBenchmark() {
      const results = [];
      const scales = [
        { name: 'Low', faces: 1000 },
        { name: 'Medium-Low', faces: 5000 },
        { name: 'Medium', faces: 10000 },
        { name: 'Medium-High', faces: 20000 },
        { name: 'High', faces: 50000 },
        { name: 'High+', faces: 100000 },
        { name: 'Very High', faces: 200000 },
        { name: 'Extreme', faces: 500000 },
        { name: 'Maximum', faces: 1000000 }
      ];

      console.log('Starting WebGL performance benchmark...');
      
      for(const scale of scales) {
        try {
          const result = await testPerformance(scale.faces, 1, scales[scales.length-1].faces);
          results.push(result);
          
          // Show summary for this scale
          alert(`Tested: ${result.faces.toLocaleString()} faces\nP95: ${result.p95Ms}ms\nAvg FPS: ${(1000/result.avgMs).toFixed(1)}`);
          
          if(result.p95Ms > 50) {
            console.log('Slow threshold reached, continuing to find maximum...');
          }
        } catch(error) {
          console.error(`Test failed at ${scale.faces} faces:`, error);
          break;
        }
      }
      
      // Final summary
      console.log('\n=== Benchmark Results ===');
      results.forEach(r => {
        const fps = (1000/r.avgMs).toFixed(1);
        console.log(`${r.faces.toLocaleString()} faces: ${r.p95Ms.toFixed(2)}ms P95, ${fps} FPS`);
      });
    }

    // Start benchmark on load
    window.addEventListener('load', runBenchmark);

    // Animation loop for smooth orbit
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
